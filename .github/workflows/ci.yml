name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "code/backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/backend/requirements.txt
          pip install pytest beautifulsoup4 python-dotenv pyyaml playwright

      - name: Run tests with pytest
        env:
          HOST_API_TOKEN: "ci-dummy-test-token-2026-safe-nonleaked-value"
          PYTHONPATH: "code:code/backend"
        run: |
          pytest -v
